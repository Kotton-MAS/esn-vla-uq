[project]
name = "esn-vla-uq"
version = "0.1.0.dev0"
description = "Uncertainty quantification for VLA policies via Echo State Networks"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Takumi Kotooka" }]
# CITATION.cff の keywords と揃える (`make version-consistency` はバージョンのみ
# 検査するため、こちらは目視で揃える)。
keywords = [
    "reservoir-computing",
    "echo-state-network",
    "uncertainty-quantification",
    "vision-language-action",
    "robot-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.5.1",
]

[project.optional-dependencies]
# reliability diagram の作図にのみ使う。コア (ESN・診断・conformal・較正の数値) は
# numpy だけで動く。図が無くても評価は止まらない (`calibration/plot.py`)。
viz = ["matplotlib>=3.10"]

[project.scripts]
esn-vla-uq = "esn_vla_uq.cli:main"

[project.urls]
Repository = "https://github.com/Kotton-MAS/esn-vla-uq"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esn_vla_uq"]

# sdist には「ソースからビルドし直せる」ものだけを入れる (U1)。既定では
# .claude/ や .devcontainer/、7,000 行超の docs/ まで同梱されていた。
# 設計文書はリポジトリで読むものであり、配布物に入れる理由がない。
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/pyproject.toml",
    "/Makefile",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10",
    "mypy>=1.19.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.4",
]

[tool.uv]
# 推移的依存の既知脆弱性への対処 (S9)。pygments は pytest / rich (pip-audit) が
# 引き込むだけで直接依存ではないため、`dependency-groups` に足さず制約で解決する。
# `make ci` の `audit` ターゲットが pip-audit を実行するので、修正版が出た依存を
# ここに書き忘れれば CI が落ちる。
constraint-dependencies = [
    "pygments>=2.20.0", # PYSEC-2026-2987
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "T20", # flake8-print: print() 禁止 (CLAUDE.md の規約を機械的に強制)
    "RUF", # ruff 固有ルール
]

[tool.mypy]
strict = true
# CLAUDE.md の「Any 禁止」を機械的に強制
disallow_any_explicit = true
# src レイアウト: mypy がインストール済みパッケージではなく src/ の実体を解決する
mypy_path = ["src"]
exclude = ["\\.venv"]
