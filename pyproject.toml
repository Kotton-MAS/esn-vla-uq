[project]
name = "esn-vla-uq"
version = "0.1.0.dev0"
description = "Uncertainty quantification for VLA policies via Echo State Networks"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Takumi Kotooka" }]
dependencies = [
    "numpy>=2.5.1",
]

[project.scripts]
esn-vla-uq = "esn_vla_uq.cli:main"

[project.urls]
Repository = "https://github.com/Kotton-MAS/esn-vla-uq"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esn_vla_uq"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "T20", # flake8-print: print() 禁止 (CLAUDE.md の規約を機械的に強制)
    "RUF", # ruff 固有ルール
]

[tool.mypy]
strict = true
# CLAUDE.md の「Any 禁止」を機械的に強制
disallow_any_explicit = true
# src レイアウト: mypy がインストール済みパッケージではなく src/ の実体を解決する
mypy_path = ["src"]
exclude = ["\\.venv"]
