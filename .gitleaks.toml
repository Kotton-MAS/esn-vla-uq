# gitleaks の設定。既定ルールをそのまま使い、走査対象だけを絞る。
#
# `gitleaks dir` は `.gitignore` を参照しない。そのため既定では生成物まで走査し、
# 本プロジェクトでは `.mypy_cache/` (約 56 MB) が走査量の 98% を占めていた
# (追跡ファイルの合計は約 1.2 MB)。検出対象になりえない生成物を除くことで、
# `make secrets` を約 2.5 秒から 0.1 秒台へ短縮する。
#
# 除外するのはツールが生成するキャッシュ・仮想環境・ビルド成果物だけに限る。
# 「ここに秘密は入らないはず」という理由でソースを除外しない (それは検査を
# 弱めるのと同じ)。

[extend]
useDefault = true

[allowlist]
description = "ツール生成物と仮想環境 (追跡対象外)"
paths = [
    '''(^|/)\.git/''',
    '''(^|/)\.venv/''',
    '''(^|/)\.mypy_cache/''',
    '''(^|/)\.ruff_cache/''',
    '''(^|/)\.pytest_cache/''',
    '''(^|/)__pycache__/''',
    '''(^|/)htmlcov/''',
    '''(^|/)node_modules/''',
    '''(^|/)(build|dist)/''',
    '''(^|/)\.coverage$''',
]
