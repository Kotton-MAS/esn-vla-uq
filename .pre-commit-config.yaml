default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # list of supported hooks: https://pre-commit.com/hooks.html
      - id: trailing-whitespace # 行末の不要な空白を削除
      - id: end-of-file-fixer # ファイルの末尾に改行を保証
      - id: check-docstring-first # ドキュメント文字列が関数定義の直後にあるかを確認
      - id: check-yaml # YAMLファイルの構文エラーをチェック
      - id: detect-private-key # プライベートキーがコミットされていないかをチェック
      - id: check-toml # TOMLファイルの構文エラーをチェック
      - id: check-case-conflict # ファイル名の大文字小文字の競合を検出
      - id: check-added-large-files # 特定のサイズを超える大きなファイルが追加された場合に警告

  # python linter and formatter
  # プロジェクトの .venv にある ruff を使う (language: system + uv run)。
  # 対象ファイルは pre-commit が引数として渡すため "." は付けない。
  - repo: local
    hooks:
      # Run the linter.
      - id: ruff
        name: ruff-lint
        types_or: [python, jupyter]
        entry: uv run ruff check --fix --force-exclude
        language: system

      # Run the formatter.
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, jupyter]

  # yaml, json formatting
  # 公式ミラー (pre-commit/mirrors-prettier) はアーカイブ済みのため維持されているフォークを使用
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.4
    hooks:
      - id: prettier
        types: [yaml, json]

  # shell scripts linter
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # md formatting
  # executablebooks/mdformat は hukkin/mdformat に移管済み (旧URLは301リダイレクトされるが直接参照する)
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: ["--number"] # ファイル内の見出しに番号を自動的に付ける
        additional_dependencies:
          - mdformat-gfm # GFM 記法 (テーブル記法を含む) に対応
          - mdformat_frontmatter
          # - mdformat-toc  # 目次を自動生成する
          # - mdformat-black  # コードブロック内のコードをフォーマットする

  # word spelling linter
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args:
          - --skip=logs/**,data/**,*.ipynb
          # fro: np.linalg.norm(..., ord="fro") の Frobenius ノルム指定子。
          - --ignore-words-list=fro

  # jupyter notebook cell output clearing
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  # secret scanning
  # detect-private-key は PEM 形式の秘密鍵しか見ない。API キー・トークン類は
  # 素通りする上、.gitignore は `git add -f` で無効化できるため、除外パターンの
  # 網羅性だけに依存しない検出をここに置く (S8)。
  # `make ci` の `secrets` ターゲットからも同じフックを呼ぶ (pre-commit は
  # インストールされていないと動かないため、CI 側で別途走らせる)。
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        # 既定の entry は `gitleaks git --pre-commit --staged` で、**ステージ済み
        # 差分しか見ない**。CI (`make secrets`) はクリーンな checkout で走るため
        # ステージ済み差分が空になり、何も検査しないまま必ず成功してしまう。
        # 作業ツリー全体を走査する `dir` モードに置き換える (実測: 検出を確認済み)。
        entry: gitleaks dir . --redact --no-banner
        pass_filenames: false
